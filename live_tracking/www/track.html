{% extends "templates/base.html" %}

{% block title %}{{ _("Lacak Pengiriman") }}{% endblock %}

{% block head %}
<link rel="stylesheet" href="/assets/live_tracking/leaflet/leaflet.css">
<link rel="stylesheet" href="/assets/live_tracking/css/tracking.css">
{% endblock %}

{% block content %}
<div class="lt-page" id="lt-track-app" data-token="{{ frappe.form_dict.token | e if frappe.form_dict.token else '' }}">
	<div class="lt-map" id="lt-map"></div>
	<div class="lt-sheet" id="lt-sheet">
		<div class="lt-error">{{ _("Memuat data tracking...") }}</div>
	</div>
</div>
{% endblock %}

{% block script %}
<script src="/assets/live_tracking/leaflet/leaflet.js"></script>
<script src="/assets/live_tracking/js/track.js?v=6"></script>
{% endblock %}
